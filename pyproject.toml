[project]
name = "lingo-overlay"
version = "0.1.0"
description = "Free, open-source, fully local real-time translation of in-game voice chat"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
